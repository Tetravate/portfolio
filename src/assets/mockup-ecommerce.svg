  <text x="228" y="432" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Proceed to Checkout →</text>
  <rect x="372" y="412" width="120" height="32" rx="6" fill="#0B1F3A" stroke="#1E3A5F" />
  <text x="388" y="432" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Apple Pay / Cards</text>
