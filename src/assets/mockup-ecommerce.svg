  <text x="374" y="260" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Anodized Laptop Riser</text>
  <text x="374" y="276" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#8E9CA8">Solid CNC machined aluminum</text>
  <text x="374" y="300" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#60A5FA">$89.00</text>
  <rect x="450" y="286" width="58" height="22" rx="4" fill="#2563EB" />
  <text x="457" y="301" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">In Cart</text>

  <!-- Product 3 -->
  <rect x="526" y="124" width="166" height="216" rx="8" fill="#0B1F3A" stroke="#1E3A5F" stroke-width="1" />
  <rect x="534" y="132" width="150" height="110" rx="6" fill="#102747" />
  <circle cx="609" cy="180" r="28" fill="#071527" />
  <circle cx="609" cy="180" r="14" fill="#2563EB" />
  <text x="542" y="260" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Modular Cable Hub</text>
  <text x="542" y="276" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#8E9CA8">Magnetic under-desk anchor</text>
  <text x="542" y="300" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#60A5FA">$34.00</text>
  <rect x="626" y="286" width="58" height="22" rx="4" fill="#102747" stroke="#2563EB" />
  <text x="634" y="301" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">+ Add</text>

  <!-- Bottom Fast-Checkout Banner -->
