  <text x="210" y="378" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#60A5FA">FAST-CHECKOUT PIPELINE</text>
  <text x="210" y="398" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#CBD5E1">2 items selected • Subtotal: $137.00 • Taxes calculated at checkout</text>
