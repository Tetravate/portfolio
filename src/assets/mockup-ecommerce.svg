  <circle cx="52" cy="37" r="5" fill="#F59E0B" />
  <circle cx="68" cy="37" r="5" fill="#60A5FA" />
  <rect x="96" y="27" width="380" height="20" rx="4" fill="#071527" stroke="#1E3A5F" stroke-width="1" />
