<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none" aria-label="Modern E-Commerce Storefront Interface Mockup">
  <!-- Outer Browser / Device Frame -->
  <rect width="720" height="480" rx="16" fill="#071527" />
  
  <!-- Browser Chrome Top Bar -->
  <rect x="16" y="16" width="688" height="42" rx="8" fill="#0B1F3A" stroke="#1E3A5F" stroke-width="1" />
