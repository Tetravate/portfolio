<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none" aria-label="MISTIQ Personalized Learning Interface Mockup">
  <!-- Outer Window Container -->
  <rect width="720" height="480" rx="16" fill="#0B1F3A" />
  
  <!-- Screen Bezel Background -->
  <rect x="16" y="16" width="688" height="448" rx="10" fill="#F8FAFC" />

  <!-- Top App Navigation -->
  <rect x="16" y="16" width="688" height="52" rx="10" fill="#0B1F3A" />
  <rect x="16" y="58" width="688" height="10" fill="#0B1F3A" />
  <text x="36" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">MISTIQ // Adaptive Step Scaffolding</text>

  <rect x="330" y="28" width="134" height="28" rx="14" fill="#132B4F" stroke="#2563EB" stroke-width="1" />
  <text x="344" y="46" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#60A5FA">Physics: Kinematics 2</text>

  <rect x="556" y="28" width="128" height="28" rx="6" fill="#2563EB" />
  <text x="572" y="46" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Next Exercise →</text>

  <!-- Left Side: Problem Statement & Student Working Canvas -->
  <rect x="36" y="82" width="410" height="362" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  
  <text x="52" y="108" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#2563EB">EXERCISE 4.2</text>
  <text x="52" y="128" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#0B1F3A">Calculate the stopping distance of a 1200kg vehicle</text>
  <text x="52" y="146" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#0B1F3A">decelerating uniformly from 25 m/s at -4.5 m/s².</text>

  <line x1="52" y1="162" x2="430" y2="162" stroke="#F1F5F9" stroke-width="1.5" />

  <text x="52" y="184" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">STUDENT REASONING STEPS</text>

  <!-- Step 1: Valid -->
  <rect x="52" y="196" width="378" height="52" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
  <circle cx="70" cy="222" r="9" fill="#0B1F3A" />
  <text x="67" y="226" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
  <text x="90" y="217" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0B1F3A">Identify Knowns: v₀ = 25 m/s, v = 0 m/s, a = -4.5 m/s²</text>
  <text x="90" y="235" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#2563EB">✓ Correct formulation of parameters</text>

  <!-- Step 2: Valid -->
  <rect x="52" y="258" width="378" height="52" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
  <circle cx="70" cy="284" r="9" fill="#0B1F3A" />
  <text x="66" y="288" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
  <text x="90" y="279" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0B1F3A">Select Formula: v² = v₀² + 2ad</text>
  <text x="90" y="297" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#2563EB">✓ Optimal kinematic relationship selected</text>

  <!-- Step 3: Divergence Alert / Current Step -->
  <rect x="52" y="320" width="378" height="64" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" />
  <circle cx="70" cy="348" r="9" fill="#2563EB" />
  <text x="66" y="352" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
  <text x="90" y="343" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0B1F3A">0 = (25)² + 2(4.5)d   [Sign ambiguity detected]</text>
  <text x="90" y="365" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2563EB">MISTIQ: Analyzing sign inversion in acceleration term...</text>

  <!-- Right Side: MISTIQ Socratic Guidance Card -->
  <rect x="462" y="82" width="222" height="362" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  
  <rect x="478" y="98" width="190" height="32" rx="6" fill="#0B1F3A" />
  <text x="494" y="119" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Socratic Micro-Hint</text>

  <text x="478" y="154" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0B1F3A">Notice the direction:</text>
  <text x="478" y="174" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#475569" width="190">The vehicle is slowing down, so acceleration opposes the forward velocity.</text>

  <rect x="478" y="210" width="190" height="74" rx="6" fill="#F1F5F9" stroke="#E2E8F0" />
  <text x="490" y="232" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#0B1F3A">Check your acceleration sign:</text>
  <text x="490" y="250" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#475569">Did you plug in -4.5 or +4.5?</text>
  <text x="490" y="268" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#2563EB">Tap to adjust formula step</text>

  <line x1="478" y1="302" x2="668" y2="302" stroke="#E2E8F0" stroke-width="1.5" />

  <text x="478" y="326" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0B1F3A">WHY IT MATTERS</text>
  <text x="478" y="344" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#64748B">Preserving negative deceleration avoids yielding a negative stopping distance.</text>

  <rect x="478" y="380" width="190" height="34" rx="6" fill="#2563EB" />
  <text x="512" y="402" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">Apply Gentle Correction</text>
</svg>
