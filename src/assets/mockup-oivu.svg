<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none" aria-label="Oivu Gig Worker Rest Point Network Mockup">
  <!-- Outer Slate Canvas -->
  <rect width="720" height="480" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2" />
  
  <!-- Centered Mobile Phone Shell -->
  <g transform="translate(180, 20)">
    <!-- Phone Bezel -->
    <rect width="360" height="440" rx="28" fill="#0B1F3A" />
    <!-- Screen Area -->
    <rect x="10" y="10" width="340" height="420" rx="20" fill="#FFFFFF" />
    
    <!-- Top Notch -->
    <rect x="120" y="14" width="120" height="18" rx="9" fill="#0B1F3A" />
    
    <!-- App Header -->
    <rect x="10" y="36" width="340" height="52" fill="#0B1F3A" />
    <text x="28" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Oivu Rest Network</text>
    <rect x="236" y="52" width="94" height="24" rx="12" fill="#2563EB" />
    <text x="246" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">● GPS Active</text>

    <!-- Search / Fast Action Bar -->
    <rect x="24" y="100" width="312" height="42" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <circle cx="42" cy="121" r="5" stroke="#2563EB" stroke-width="2" fill="none" />
    <text x="56" y="126" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#475569">Find nearest rest point &amp; clean water...</text>

    <!-- Map Preview Strip -->
    <rect x="24" y="152" width="312" height="120" rx="10" fill="#E2E8F0" />
    <!-- Roads on Mini Map -->
    <path d="M24 190 Q 180 170, 336 210" stroke="#CBD5E1" stroke-width="12" fill="none" />
    <path d="M120 152 L 150 272" stroke="#CBD5E1" stroke-width="8" fill="none" />
    <path d="M260 152 L 240 272" stroke="#CBD5E1" stroke-width="8" fill="none" />
    <!-- User current location dot -->
    <circle cx="130" cy="200" r="10" fill="#2563EB" fill-opacity="0.3" />
    <circle cx="130" cy="200" r="5" fill="#2563EB" />
    <text x="85" y="224" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#0B1F3A">You are here</text>

    <!-- Pin 1: Open Rest Point -->
    <g transform="translate(230, 175)">
      <circle cx="14" cy="14" r="14" fill="#0B1F3A" />
      <polygon points="14,32 7,24 21,24" fill="#0B1F3A" />
      <text x="9" y="19" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#60A5FA">O</text>
    </g>

    <!-- Bottom Selected Rest Point Card -->
    <rect x="24" y="282" width="312" height="136" rx="10" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5" />
    
    <text x="38" y="306" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0B1F3A">Metro Junction Rest Hub</text>
    <text x="38" y="322" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#64748B">350m away • Open 24/7 • Verified Partner</text>

    <!-- Amenity Badges -->
    <g transform="translate(38, 332)">
      <rect x="0" y="0" width="70" height="24" rx="4" fill="#EFF6FF" stroke="#BFDBFE" />
      <text x="8" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#2563EB">💧 Water</text>

      <rect x="76" y="0" width="84" height="24" rx="4" fill="#EFF6FF" stroke="#BFDBFE" />
      <text x="84" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#2563EB">⚡ Charging</text>

      <rect x="166" y="0" width="86" height="24" rx="4" fill="#EFF6FF" stroke="#BFDBFE" />
      <text x="174" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#2563EB">🚻 Washroom</text>
    </g>

    <!-- Direction Button -->
    <rect x="38" y="368" width="284" height="36" rx="6" fill="#2563EB" />
    <text x="110" y="391" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Get Walking Route (3 min)</text>
  </g>

  <!-- Left Side Annotations -->
  <g transform="translate(24, 80)">
    <rect width="136" height="88" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="12" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0B1F3A">HUMAN PURPOSE</text>
    <text x="12" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#475569">Dignified rest for</text>
    <text x="12" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#475569">delivery riders &amp;</text>
    <text x="12" y="76" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#2563EB">urban gig workforce.</text>
  </g>

  <g transform="translate(24, 210)">
    <rect width="136" height="88" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="12" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0B1F3A">LIGHTWEIGHT</text>
    <text x="12" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#475569">Under 400KB PWA</text>
    <text x="12" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#475569">works seamlessly</text>
    <text x="12" y="76" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#2563EB">on 2G/3G connections.</text>
  </g>

  <!-- Right Side Annotations -->
  <g transform="translate(560, 80)">
    <rect width="136" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="12" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0B1F3A">KEY AMENITIES</text>
    <text x="12" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#475569">• Clean drinking water</text>
    <text x="12" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#475569">• Sanitary washrooms</text>
    <text x="12" y="76" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#475569">• Phone recharge dock</text>
    <text x="12" y="92" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#475569">• Weather protection</text>
  </g>
</svg>
